# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          # Homebrew's libomp targets the runner's macOS version.
          - os: macos-14
            macos-deployment-target: "14.0"
          - os: macos-15-intel
            macos-deployment-target: "15.0"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          # setup.py installs pure Python when the C++ build fails, so build
          # with NumPy already present and check that the extension imports.
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          CIBW_BEFORE_BUILD: pip install numpy setuptools
          # The import check needs only NumPy. Skipping the other dependencies
          # avoids compiling scikit-learn, which has no musllinux wheel.
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_ENVIRONMENT: PIP_NO_DEPS=1
          CIBW_TEST_COMMAND: python -c "import pyBKT.fit.E_step"
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_BEFORE_ALL_MACOS: brew install libomp
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-deployment-target }}
            CPPFLAGS="-I$(brew --prefix libomp)/include"
            LDFLAGS="-L$(brew --prefix libomp)/lib"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists-sdist
          path: dist/*.tar.gz

  # Lists what the sdist installs with, as a CycloneDX SBOM. pyBKT doesn't pin
  # its dependencies, so the versions are the ones pip resolved in this run.
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-sdist

    steps:
      - name: Retrieve the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists-sdist
          path: dist/

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Install the sdist and describe its environment
        run: |
          python -m venv sbom-env
          sbom-env/bin/python -m pip install dist/*.tar.gz
          python -m pip install cyclonedx-bom==8.0.1
          cyclonedx-py environment --output-reproducible --output-format JSON --output-file pybkt-sbom.cdx.json sbom-env

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: pybkt-sbom.cdx.json
          if-no-files-found: error

  attach-sbom:
    name: Attach SBOM to the GitHub release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: sbom
    permissions:
      contents: write # uploads the SBOM as a release asset

    steps:
      - name: Retrieve the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Upload the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" pybkt-sbom.cdx.json --repo "$GITHUB_REPOSITORY"

  # PyPI accepts one SLSA attestation per file, and actions/attest writes one
  # attestation per call, so the files are listed here and attested one by one.
  list-dists:
    name: List distributions
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build-wheels
      - build-sdist
    outputs:
      files: ${{ steps.list.outputs.files }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-dists-*
          merge-multiple: true
          path: dist/

      - name: List distributions
        id: list
        run: |
          ls dist
          echo "files=$(ls dist | jq --raw-input --slurp --compact-output 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  # Signs SLSA build provenance for each file with this workflow's identity.
  # A manual run does everything except the upload to PyPI.
  attest:
    name: Attest ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: list-dists
    permissions:
      contents: read
      id-token: write # Sigstore signs with the workflow's OIDC token
      attestations: write # stores the attestation on GitHub
    strategy:
      fail-fast: true
      matrix:
        file: ${{ fromJSON(needs.list-dists.outputs.files) }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-dists-*
          merge-multiple: true
          path: dist/

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ matrix.file }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      # twine uploads every <file>.*.attestation next to a distribution, so
      # this name puts the attestation on PyPI beside the publish attestation.
      - name: Convert the Sigstore bundle to a PyPI attestation
        env:
          FILE: ${{ matrix.file }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          python -m pip install pypi-attestations==0.0.31
          pypi-attestations convert --output-file "dist/$FILE.slsa.attestation" "$BUNDLE"
          pypi-attestations verify attestation --identity "$IDENTITY" "dist/$FILE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slsa-attestation-${{ matrix.file }}
          path: dist/*.slsa.attestation
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build-wheels
      - build-sdist
      - attest
    permissions:
      id-token: write # mandatory for PyPI Trusted Publishing

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      url: https://pypi.org/project/pyBKT
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-dists-*
          merge-multiple: true
          path: dist/

      - name: Retrieve SLSA attestations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: slsa-attestation-*
          merge-multiple: true
          path: dist/

      # Adds a publish attestation to each file and uploads both attestations.
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
