[package]
name = "bkt_lean"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"   # 1.89 with --features simd (fearless_simd)

[lib]
name = "bkt_lean"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.3", default-features = false, features = ["macros", "extension-module", "abi3-py311"] }
fearless_simd = { version = "1.1.0", optional = true }

[features]
default = []
# explicit SIMD lanes via fearless_simd (runtime ISA dispatch); off by default
simd = ["dep:fearless_simd"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
